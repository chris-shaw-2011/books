name: Update

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  packages: write

# Serialize dependency commits with releases.
concurrency:
  group: books-release
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    env:
      # Only the metadata check needs private-registry access; Docker needs no token.
      READ_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: current

      - name: Resolve compatible production updates and security fixes
        run: node scripts/update-production-dependencies.ts

      - name: Commit production dependency updates
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No production dependency updates."
            exit 0
          fi
          node scripts/bump-update-version.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: update compatible production dependencies"
          git push origin HEAD:master

      - name: Tag application version
        id: version
        run: bash scripts/tag-version.sh

  build-container:
    needs: update
    uses: ./.github/workflows/build-container.yml
    with:
      new_version_created: ${{ needs.update.outputs.new-version == 'true' }}
      version_tag: ${{ needs.update.outputs.version }}
