name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build
        uses: ./.github/actions/prepare-build

      - name: Compare bin with latest release
        id: compare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          changed=true
          reason="no previous release found"

          release_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" || true)"

          if [ -n "${release_json}" ] && echo "${release_json}" | jq -e '.id' >/dev/null 2>&1; then
            asset_api_url="$(echo "${release_json}" | jq -r '.assets[]? | select(.name == "transpiled.tar.gz") | .url' | head -n 1)"

            if [ -n "${asset_api_url}" ] && [ "${asset_api_url}" != "null" ]; then
              curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/octet-stream" \
                "${asset_api_url}" \
                -o /tmp/transpiled.tar.gz

              rm -rf /tmp/released-bin
              mkdir -p /tmp/released-bin
              tar -xzf /tmp/transpiled.tar.gz -C /tmp/released-bin

              if [ -d /tmp/released-bin/bin ]; then
                if diff -qr ./bin /tmp/released-bin/bin >/dev/null; then
                  changed=false
                  reason="bin matches latest release"
                else
                  reason="bin differs from latest release"
                fi
              else
                reason="latest release asset missing bin directory"
              fi
            else
              reason="latest release missing transpiled.tar.gz"
            fi
          fi

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Bump & Push patch version
        if: steps.compare.outputs.changed == 'true'
        id: bump
        env:
          RELEASE_TRIGGER_TOKEN: ${{ secrets.RELEASE_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail

          new_version="$(node -e '
            const fs = require("fs");
            const path = "package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            const parts = String(pkg.version || "").split(".");
            if (parts.length !== 3 || parts.some((p) => !/^[0-9]+$/.test(p))) {
              throw new Error(`Expected package.json version in x.y.z format, got: ${pkg.version}`);
            }
            parts[2] = String(Number(parts[2]) + 1);
            pkg.version = parts.join(".");
            fs.writeFileSync(path, JSON.stringify(pkg, null, "\t") + "\n");
            process.stdout.write(pkg.version);
          ')"

          echo "value=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Bumped version to ${new_version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          if [ -z "${RELEASE_TRIGGER_TOKEN:-}" ]; then
            echo "::error::Missing secret RELEASE_TRIGGER_TOKEN. Set a PAT/app token with repo write access so this push triggers the Release workflow."
            exit 1
          fi

          git commit -m "chore: bump version to ${new_version}"
          git push "https://x-access-token:${RELEASE_TRIGGER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
