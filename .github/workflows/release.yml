name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: books-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag application version
        id: version
        run: bash scripts/tag-version.sh

  build-container:
    needs: tag
    if: needs.tag.outputs.changed == 'true'
    uses: ./.github/workflows/build-container.yml
    with:
      new_version_created: true
      version_tag: ${{ needs.tag.outputs.version }}
