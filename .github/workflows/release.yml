name: Release

on:
  - workflow_dispatch
  - push

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install packages
        run: npm install

      - name: Build
        run: npm run build

      - name: Tar
        uses: a7ul/tar-action@v1.2.0
        id: compress
        with:
          command: c
          cwd: ./
          files: |
            ./bin
          outPath: transpiled.tar.gz

      - name: Getting release version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Normalize image name
        id: image-name
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          build-args: |
            APP_VERSION=${{ steps.package-version.outputs.current-version }}
          tags: |
            ${{ steps.image-name.outputs.value }}:${{ steps.package-version.outputs.current-version }}
            ${{ steps.image-name.outputs.value }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.package-version.outputs.current-version }}

      - name: Package release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transpiled.tar.gz
          tag_name: ${{ steps.package-version.outputs.current-version }}
          make_latest: true
