name: Test maintenance scripts
run-name: "Maintenance tests — ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event.head_commit.message }}"

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - .github/workflows/**
      - scripts/**
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/**
      - scripts/**

permissions:
  contents: read

jobs:
  test:
    name: Test dependency updates, versioning & Libation resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: current
      - name: Test maintenance scripts
        run: node --test scripts/*.test.ts
