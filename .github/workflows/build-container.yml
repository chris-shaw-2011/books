name: Build Container

on:
  workflow_call:
    inputs:
      new_release_created:
        description: True when invoked after creating a new GitHub release.
        required: false
        type: boolean
        default: false
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release-created flag
        id: release-created
        env:
          INPUT_NEW_RELEASE_CREATED: ${{ inputs.new_release_created }}
        run: |
          set -euo pipefail

          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Input new_release_created: ${INPUT_NEW_RELEASE_CREATED:-<unset>}"

          flag="false"
          if [ "${INPUT_NEW_RELEASE_CREATED:-false}" = "true" ]; then
            flag="true"
          fi

          echo "Resolved release-created flag: ${flag}"
          echo "value=${flag}" >> "$GITHUB_OUTPUT"

      - name: Download latest release artifact
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Fetching latest release for ${GITHUB_REPOSITORY}"
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")"

          if ! echo "${release_json}" | jq -e '.id' >/dev/null 2>&1; then
            echo "No latest release found."
            exit 1
          fi

          release_tag="$(echo "${release_json}" | jq -r '.tag_name // empty')"
          release_version="${release_tag#v}"
          echo "Latest release tag: ${release_tag}"
          echo "Normalized release version: ${release_version}"
          if ! [[ "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid latest release tag_name: ${release_tag}"
            exit 1
          fi
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"

          asset_api_url="$(echo "${release_json}" | jq -r '.assets[]? | select(.name == "transpiled.tar.gz") | .url' | head -n 1)"
          if [ -z "${asset_api_url}" ] || [ "${asset_api_url}" = "null" ]; then
            echo "Latest release is missing transpiled.tar.gz."
            exit 1
          fi
          echo "Found transpiled.tar.gz asset. Downloading."

          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${asset_api_url}" \
            -o /tmp/transpiled.tar.gz

          rm -rf ./bin
          tar -xzf /tmp/transpiled.tar.gz -C .

          if [ ! -d ./bin ]; then
            echo "Release archive does not contain ./bin."
            exit 1
          fi
          echo "Release artifact extracted into ./bin"

      - name: Normalize image name
        id: image-name
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image reference from Dockerfile.release
        id: base-image
        run: |
          set -euo pipefail

          base_ref="$(awk '
            BEGIN { IGNORECASE=1 }
            /^[[:space:]]*FROM[[:space:]]+/ {
              line = $0
              sub(/^[[:space:]]*FROM[[:space:]]+/, "", line)
              n = split(line, parts, /[[:space:]]+/)
              image = ""
              for (i = 1; i <= n; i++) {
                token = parts[i]
                if (token ~ /^--/) {
                  continue
                }
                image = token
                break
              }
              if (image != "") {
                last = image
              }
            }
            END {
              if (last != "") {
                print last
              }
            }
          ' Dockerfile.release)"

          if [ -z "${base_ref}" ]; then
            echo "Failed to parse base image from Dockerfile.release"
            exit 1
          fi

          echo "Resolved base image reference: ${base_ref}"
          echo "ref=${base_ref}" >> "$GITHUB_OUTPUT"

      - name: Resolve current base image digest
        id: current-base
        env:
          BASE_IMAGE_REF: ${{ steps.base-image.outputs.ref }}
        run: |
          set -euo pipefail

          inspect_output="$(docker buildx imagetools inspect "${BASE_IMAGE_REF}")"
          base_digest="$(printf '%s\n' "${inspect_output}" | awk '/^[[:space:]]*Digest:/ {print $2; exit}')"

          if [ -z "${base_digest}" ]; then
            echo "Failed to resolve digest for base image ${BASE_IMAGE_REF}"
            exit 1
          fi

          echo "Current base image reference: ${BASE_IMAGE_REF}"
          echo "Current base image digest: ${base_digest}"
          echo "digest=${base_digest}" >> "$GITHUB_OUTPUT"

      - name: Set up current Node for release resolution
        uses: actions/setup-node@v6
        with:
          node-version: current

      - name: Test container update checks
        run: node --test scripts/resolve-libation-release.test.ts scripts/check-apt-updates.test.ts

      - name: Resolve current Libation package
        id: current-libation
        run: |
          set -euo pipefail
          node scripts/resolve-libation-release.ts amd64 > /tmp/libation-release.json
          version="$(node -p 'require("/tmp/libation-release.json").version')"
          sha256="$(node -p 'require("/tmp/libation-release.json").sha256')"
          echo "Current Libation version: ${version}"
          echo "Current Libation SHA256: ${sha256}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Hash published container sources
        id: container-source
        run: |
          set -euo pipefail
          digest="$(sha256sum Dockerfile.release scripts/install-libation.sh scripts/resolve-libation-release.ts scripts/check-docker-runtime.ts | sha256sum | awk '{print $1}')"
          echo "Published container source SHA256: ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Read latest uploaded container metadata
        id: latest-image
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
        run: |
          set -euo pipefail

          found=false
          version=""
          base_digest=""
          release_version=""
          libation_sha256=""
          source_digest=""

          if docker pull "${IMAGE_NAME}:latest" >/dev/null 2>&1; then
            found=true
            version="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE_NAME}:latest" || true)"
            base_digest="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "${IMAGE_NAME}:latest" || true)"
            release_version="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.release.version" }}' "${IMAGE_NAME}:latest" || true)"
            libation_sha256="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.libation.sha256" }}' "${IMAGE_NAME}:latest" || true)"
            source_digest="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.container-source.sha256" }}' "${IMAGE_NAME}:latest" || true)"
          fi

          if [ "${found}" = "true" ]; then
            echo "Previous latest image found: ${IMAGE_NAME}:latest"
            echo "Previous version label: ${version}"
            echo "Previous release version label: ${release_version}"
            echo "Previous base digest label: ${base_digest}"
            echo "Previous Libation SHA256 label: ${libation_sha256}"
            echo "Previous container source SHA256 label: ${source_digest}"
          else
            echo "No previous latest image found at ${IMAGE_NAME}:latest"
          fi

          echo "found=${found}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "base-digest=${base_digest}" >> "$GITHUB_OUTPUT"
          echo "release-version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "libation-sha256=${libation_sha256}" >> "$GITHUB_OUTPUT"
          echo "source-digest=${source_digest}" >> "$GITHUB_OUTPUT"

      - name: Check installed Debian packages for upgrades
        id: apt-updates
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
          PREVIOUS_FOUND: ${{ steps.latest-image.outputs.found }}
          PREVIOUS_RELEASE_VERSION: ${{ steps.latest-image.outputs.release-version }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_BASE_DIGEST: ${{ steps.latest-image.outputs.base-digest }}
          CURRENT_BASE_DIGEST: ${{ steps.current-base.outputs.digest }}
          PREVIOUS_LIBATION_SHA256: ${{ steps.latest-image.outputs.libation-sha256 }}
          CURRENT_LIBATION_SHA256: ${{ steps.current-libation.outputs.sha256 }}
          PREVIOUS_SOURCE_DIGEST: ${{ steps.latest-image.outputs.source-digest }}
          CURRENT_SOURCE_DIGEST: ${{ steps.container-source.outputs.digest }}
        run: |
          set -euo pipefail

          count=0
          if [ "${PREVIOUS_FOUND}" = "true" ] \
            && [ "${PREVIOUS_RELEASE_VERSION}" = "${RELEASE_VERSION}" ] \
            && [ "${PREVIOUS_BASE_DIGEST}" = "${CURRENT_BASE_DIGEST}" ] \
            && [ "${PREVIOUS_LIBATION_SHA256}" = "${CURRENT_LIBATION_SHA256}" ] \
            && [ "${PREVIOUS_SOURCE_DIGEST}" = "${CURRENT_SOURCE_DIGEST}" ]; then
            count="$(docker run --rm --interactive --user root --entrypoint sh "${IMAGE_NAME}:latest" -s < scripts/check-apt-updates.sh)"
          fi

          [[ "${count}" =~ ^[0-9]+$ ]] || { echo "Invalid APT upgrade count: ${count}"; exit 1; }
          echo "Available Debian package upgrades: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build and what version to use
        id: decision
        env:
          RELEASE_CREATED: ${{ steps.release-created.outputs.value }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_FOUND: ${{ steps.latest-image.outputs.found }}
          PREVIOUS_VERSION: ${{ steps.latest-image.outputs.version }}
          PREVIOUS_BASE_DIGEST: ${{ steps.latest-image.outputs.base-digest }}
          PREVIOUS_RELEASE_VERSION: ${{ steps.latest-image.outputs.release-version }}
          CURRENT_BASE_DIGEST: ${{ steps.current-base.outputs.digest }}
          CURRENT_LIBATION_SHA256: ${{ steps.current-libation.outputs.sha256 }}
          PREVIOUS_LIBATION_SHA256: ${{ steps.latest-image.outputs.libation-sha256 }}
          CURRENT_SOURCE_DIGEST: ${{ steps.container-source.outputs.digest }}
          PREVIOUS_SOURCE_DIGEST: ${{ steps.latest-image.outputs.source-digest }}
          APT_UPGRADE_COUNT: ${{ steps.apt-updates.outputs.count }}
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          should_build=false
          target_version=""
          reason=""

          echo "Decision inputs:"
          echo "  release_created=${RELEASE_CREATED}"
          echo "  release_version=${RELEASE_VERSION}"
          echo "  previous_found=${PREVIOUS_FOUND}"
          echo "  previous_version=${PREVIOUS_VERSION}"
          echo "  previous_release_version=${PREVIOUS_RELEASE_VERSION}"
          echo "  previous_base_digest=${PREVIOUS_BASE_DIGEST}"
          echo "  current_base_digest=${CURRENT_BASE_DIGEST}"
          echo "  previous_libation_sha256=${PREVIOUS_LIBATION_SHA256}"
          echo "  current_libation_sha256=${CURRENT_LIBATION_SHA256}"
          echo "  previous_source_digest=${PREVIOUS_SOURCE_DIGEST}"
          echo "  current_source_digest=${CURRENT_SOURCE_DIGEST}"
          echo "  apt_upgrade_count=${APT_UPGRADE_COUNT}"

          if [ "${BUILD_EVENT}" = "workflow_dispatch" ]; then
            should_build=true
            target_version="${RELEASE_VERSION}.build${GITHUB_RUN_NUMBER}"
            reason="container sources changed or manual rebuild requested"
          elif [ "${RELEASE_CREATED}" = "true" ]; then
            should_build=true
            target_version="${RELEASE_VERSION}"
            reason="new release created"
          else
            if [ "${PREVIOUS_FOUND}" = "true" ] \
              && [ "${PREVIOUS_RELEASE_VERSION}" = "${RELEASE_VERSION}" ] \
              && [ -n "${PREVIOUS_BASE_DIGEST}" ] \
              && [ "${PREVIOUS_BASE_DIGEST}" = "${CURRENT_BASE_DIGEST}" ] \
              && [ "${PREVIOUS_LIBATION_SHA256}" = "${CURRENT_LIBATION_SHA256}" ] \
              && [ "${PREVIOUS_SOURCE_DIGEST}" = "${CURRENT_SOURCE_DIGEST}" ] \
              && [ "${APT_UPGRADE_COUNT}" = "0" ]; then
              should_build=false
              reason="base image, Libation, container sources and Debian packages unchanged for latest release"
            else
              escaped_release="${RELEASE_VERSION//./\\.}"
              next_patch=1

              if [[ "${PREVIOUS_VERSION}" =~ ^${escaped_release}\.([0-9]+)$ ]]; then
                next_patch=$((BASH_REMATCH[1] + 1))
              elif [ "${PREVIOUS_VERSION}" = "${RELEASE_VERSION}" ]; then
                next_patch=1
              fi

              should_build=true
              target_version="${RELEASE_VERSION}.${next_patch}"

              if [ "${PREVIOUS_FOUND}" != "true" ]; then
                reason="no previous uploaded image"
              elif [ "${PREVIOUS_RELEASE_VERSION}" != "${RELEASE_VERSION}" ]; then
                reason="latest release has no corresponding container tag yet"
              elif [ -z "${PREVIOUS_BASE_DIGEST}" ]; then
                reason="previous image missing base digest label"
              elif [ "${PREVIOUS_LIBATION_SHA256}" != "${CURRENT_LIBATION_SHA256}" ]; then
                reason="Libation package changed"
              elif [ "${PREVIOUS_SOURCE_DIGEST}" != "${CURRENT_SOURCE_DIGEST}" ]; then
                reason="published container sources changed"
              elif [ "${APT_UPGRADE_COUNT}" != "0" ]; then
                reason="Debian packages have available upgrades"
              else
                reason="base image digest changed"
              fi
            fi
          fi

          echo "Decision result:"
          echo "  should_build=${should_build}"
          echo "  target_version=${target_version}"
          echo "  reason=${reason}"

          echo "should-build=${should_build}" >> "$GITHUB_OUTPUT"
          echo "target-version=${target_version}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Build candidate image
        if: steps.decision.outputs.should-build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: false
          pull: true
          load: true
          build-args: |
            APP_VERSION=${{ steps.decision.outputs.target-version }}
            LIBATION_RELEASE_SHA256=${{ steps.current-libation.outputs.sha256 }}
            APT_REFRESH=${{ github.run_id }}
          tags: books-candidate:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.decision.outputs.target-version }}
            org.opencontainers.image.release.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.release.created=${{ steps.release-created.outputs.value }}
            org.opencontainers.image.base.name=${{ steps.base-image.outputs.ref }}
            org.opencontainers.image.base.digest=${{ steps.current-base.outputs.digest }}
            org.opencontainers.image.libation.version=${{ steps.current-libation.outputs.version }}
            org.opencontainers.image.libation.sha256=${{ steps.current-libation.outputs.sha256 }}
            org.opencontainers.image.container-source.sha256=${{ steps.container-source.outputs.digest }}

      - name: Verify candidate runtime before publishing
        if: steps.decision.outputs.should-build == 'true'
        run: docker run --rm --network none --entrypoint node books-candidate:${{ github.sha }} /home/node/app/check-docker-runtime.ts

      - name: Push container image
        if: steps.decision.outputs.should-build == 'true'
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
          TARGET_VERSION: ${{ steps.decision.outputs.target-version }}
          CANDIDATE_IMAGE: books-candidate:${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Pushing tags:"
          echo "  ${IMAGE_NAME}:${TARGET_VERSION}"
          echo "  ${IMAGE_NAME}:latest"

          docker tag "${CANDIDATE_IMAGE}" "${IMAGE_NAME}:${TARGET_VERSION}"
          docker tag "${CANDIDATE_IMAGE}" "${IMAGE_NAME}:latest"

          docker push "${IMAGE_NAME}:${TARGET_VERSION}"
          docker push "${IMAGE_NAME}:latest"
