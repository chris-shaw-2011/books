name: Check & publish container

on:
  workflow_call:
    inputs:
      version_tag:
        description: Build this application tag; leave empty to check runtime updates for latest.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: ${{ inputs.version_tag && format('Prepare release {0}', inputs.version_tag) || 'Check runtime updates for latest' }}
    outputs:
      target-version: ${{ steps.decision.outputs.target-version }}
      publish-name: ${{ steps.decision.outputs.publish-name }}
      app-version: ${{ steps.app-version.outputs.version }}
      commit: ${{ steps.app-version.outputs.commit }}
      base-digest: ${{ steps.current-base.outputs.digest }}
      libation-sha256: ${{ steps.current-libation.outputs.sha256 }}
      libation-url: ${{ steps.current-libation.outputs.url }}
    runs-on: ubuntu-latest
    # Release and Update serialize publishing through their books-release group.
    steps:
      - name: Check out maintenance scripts used by this workflow
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Check out tagged application inputs
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version_tag || 'latest' }}
          path: application

      - name: Read application version
        id: app-version
        run: |
          set -euo pipefail
          version="$(jq -r .version application/package.json)"
          commit="$(git -C application rev-parse HEAD)"
          {
            echo "version=${version}"
            echo "commit=${commit}"
          } >> "$GITHUB_OUTPUT"

      - name: Set container image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve current Node base image
        id: current-base
        run: |
          set -euo pipefail
          base_ref="$(awk 'toupper($1) == "FROM" { image=$2 } END { print image }' application/Dockerfile)"
          base_digest="$(docker buildx imagetools inspect "$base_ref" --format '{{json .Manifest}}' | jq -er .digest)"
          echo "Current base image: $base_ref@$base_digest"
          echo "digest=$base_digest" >> "$GITHUB_OUTPUT"

      - name: Set up current Node for release resolution
        uses: actions/setup-node@v6
        with:
          node-version: current

      - name: Resolve current Libation package
        id: current-libation
        run: |
          set -euo pipefail
          node scripts/resolve-libation-release.ts amd64 \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' \
            | tee -a "$GITHUB_OUTPUT"

      - name: Read latest uploaded container metadata
        id: latest-image
        env:
          RELEASE_REQUESTED: ${{ inputs.version_tag != '' }}
        run: |
          set -euo pipefail

          if pull_output="$(docker pull "${IMAGE_NAME}:latest" 2>&1)"; then
            docker inspect "${IMAGE_NAME}:latest" | jq -r '
              .[0].Config.Labels |
              "found=true",
              "version=\(.["org.opencontainers.image.version"])",
              "base-digest=\(.["org.opencontainers.image.base.digest"])",
              "release-version=\(.["org.opencontainers.image.release.version"])",
              "libation-sha256=\(.["org.opencontainers.image.libation.sha256"])"
            ' | tee -a "$GITHUB_OUTPUT"
          elif [ "$RELEASE_REQUESTED" = true ] && grep -Eq 'manifest unknown|manifest .*not found|name unknown' <<< "$pull_output"; then
            printf 'found=false\nversion=\nbase-digest=\nrelease-version=\nlibation-sha256=\n' | tee -a "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$pull_output"
            exit 1
          fi

      - name: Check Debian upgrades when no release, base image or Libation update requires a build
        id: apt-updates
        if: >-
          inputs.version_tag == '' &&
          steps.latest-image.outputs.found == 'true' &&
          steps.latest-image.outputs.base-digest == steps.current-base.outputs.digest &&
          steps.latest-image.outputs.libation-sha256 == steps.current-libation.outputs.sha256
        run: |
          set -euo pipefail
          count="$(docker run --rm --interactive --user root --entrypoint sh "${IMAGE_NAME}:latest" -s < scripts/check-apt-updates.sh)"
          echo "Available Debian package upgrades: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build and what version to use
        id: decision
        env:
          RELEASE_REQUESTED: ${{ inputs.version_tag != '' }}
          RELEASE_VERSION: ${{ steps.app-version.outputs.version }}
          PREVIOUS_FOUND: ${{ steps.latest-image.outputs.found }}
          PREVIOUS_VERSION: ${{ steps.latest-image.outputs.version }}
          PREVIOUS_BASE_DIGEST: ${{ steps.latest-image.outputs.base-digest }}
          PREVIOUS_RELEASE_VERSION: ${{ steps.latest-image.outputs.release-version }}
          CURRENT_BASE_DIGEST: ${{ steps.current-base.outputs.digest }}
          CURRENT_LIBATION_SHA256: ${{ steps.current-libation.outputs.sha256 }}
          PREVIOUS_LIBATION_SHA256: ${{ steps.latest-image.outputs.libation-sha256 }}
          APT_UPGRADE_COUNT: ${{ steps.apt-updates.outputs.count || '0' }}
          APT_CHECKED: ${{ steps.apt-updates.outcome }}
          CURRENT_LIBATION_VERSION: ${{ steps.current-libation.outputs.version }}
        run: bash scripts/plan-container-build.sh

      - name: Report container update check failure
        if: failure()
        run: echo '## Container update check failed — see the failed step; no image was built or published.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: ${{ needs.check.outputs.publish-name }}
    needs: check
    if: needs.check.outputs.target-version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out application ${{ needs.check.outputs.app-version }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}

      - name: Set container image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ needs.check.outputs.target-version }}
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: Dockerfile
          push: false
          pull: true
          load: true
          cache-from: type=gha,scope=books-container
          cache-to: type=gha,scope=books-container,mode=max
          build-args: |
            APP_VERSION=${{ needs.check.outputs.target-version }}
            LIBATION_RELEASE_SHA256=${{ needs.check.outputs.libation-sha256 }}
            LIBATION_PACKAGE_URL=${{ needs.check.outputs.libation-url }}
            APT_REFRESH=${{ github.run_id }}
          tags: books-candidate:${{ needs.check.outputs.commit }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.target-version }}
            org.opencontainers.image.revision=${{ needs.check.outputs.commit }}
            org.opencontainers.image.release.version=${{ needs.check.outputs.app-version }}
            org.opencontainers.image.base.digest=${{ needs.check.outputs.base-digest }}
            org.opencontainers.image.libation.sha256=${{ needs.check.outputs.libation-sha256 }}

      - name: Verify Libation login and audio tools in ${{ needs.check.outputs.target-version }}
        id: verify
        run: docker run --rm --network none --entrypoint node books-candidate:${{ needs.check.outputs.commit }} /home/node/app/check-docker-runtime.ts

      - name: Publish ${{ needs.check.outputs.target-version }} and update container latest
        id: publish
        env:
          TARGET_VERSION: ${{ needs.check.outputs.target-version }}
          CANDIDATE_IMAGE: books-candidate:${{ needs.check.outputs.commit }}
        run: |
          set -euo pipefail

          echo "Pushing tags:"
          echo "  ${IMAGE_NAME}:${TARGET_VERSION}"
          echo "  ${IMAGE_NAME}:latest"

          docker tag "${CANDIDATE_IMAGE}" "${IMAGE_NAME}:${TARGET_VERSION}"
          docker tag "${CANDIDATE_IMAGE}" "${IMAGE_NAME}:latest"

          docker push "${IMAGE_NAME}:${TARGET_VERSION}"
          docker push "${IMAGE_NAME}:latest"

      - name: Record container publication outcome
        if: always()
        env:
          TARGET_VERSION: ${{ needs.check.outputs.target-version }}
          BUILD: ${{ steps.build.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          {
            if [ "$PUBLISH" = success ]; then
              echo "## Published container $TARGET_VERSION"
              echo
              echo "Image: \`$IMAGE_NAME:$TARGET_VERSION\`"
              echo
              echo "Container \`latest\` now points to the same image."
            else
              echo "## Container $TARGET_VERSION was not fully published"
              echo
              echo 'See the failed or cancelled step. Start Release manually to retry.'
            fi
            echo
            echo '| Build | Runtime verification | Publish |'
            echo '| --- | --- | --- |'
            echo "| $BUILD | $VERIFY | $PUBLISH |"
          } >> "$GITHUB_STEP_SUMMARY"
