name: Prepare Build
description: Setup Node, install dependencies, and build the project.

inputs:
  node-version:
    description: Node.js version for setup-node.
    required: false
    default: current

runs:
  using: composite
  steps:
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install packages
      shell: bash
      run: npm install

    - name: Build
      shell: bash
      run: npm run build

    - name: Validate server entrypoint
      shell: bash
      run: test -f ./bin/projects/server/src/index.js

    - name: Bundle production dependencies into bin
      shell: bash
      run: |
        set -euo pipefail

        cp ./package-lock.json ./bin/package-lock.json
        cd ./bin
        npm ci --omit=dev
